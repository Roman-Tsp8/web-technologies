<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Попап із додатками</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <a class="header-link" href="#">Mail</a>
      <a class="header-link" href="#">Images</a>

      <div class="popup-anchor">
        <input
          class="popup-toggle"
          type="checkbox"
          id="popup-toggle"
          aria-label="Відкрити меню додатків"
        />
        <label class="popup-button" for="popup-toggle"></label>

        <div class="popup">
          <div class="popup-body" tabindex="0">
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">📅</span>Calendar</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">✉️</span>Mail</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">📰</span>News</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">🗺️</span>Map</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">📁</span>Files</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">👤</span>Contacts</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">🌐</span>Translate</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">▶️</span>Videos</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">🔍</span>Search</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">🖼️</span>Photos</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">🧩</span>Apps</a
            >
            <a class="app-item" href="#" tabindex="0"
              ><span class="app-icon">📄</span>Documents</a
            >

            <!-- Додаткові іконки: з'являються після натискання «More» -->
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">💬</span>Chat</a
            >
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">🎓</span>Classroom</a
            >
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">⭐</span>Collection</a
            >
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">🔴</span>Mars</a
            >
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">📝</span>Blogs</a
            >
            <a class="app-item app-item--extra" href="#" tabindex="0"
              ><span class="app-icon">📣</span>Promos</a
            >
          </div>

          <div class="popup-footer">
            <input
              class="more-toggle"
              type="checkbox"
              id="more-toggle"
              aria-label="Показати більше"
            />
            <label class="more-button" for="more-toggle">
              <span class="more-text">More</span>
              <span class="less-text">Even more from Kottans</span>
            </label>
          </div>
        </div>
      </div>

      <span class="bell" aria-hidden="true">🔔</span>
      <span class="avatar" aria-hidden="true"></span>
    </header>
  </body>
</html>
