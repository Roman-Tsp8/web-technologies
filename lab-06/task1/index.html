<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна 6</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: Calibri, Arial, sans-serif;
      }

      .layout {
        position: relative;
        width: 650px;
        height: 330px;
        margin: 0 auto;
      }

      .block {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid #222;
        font-size: 26px;
        line-height: 1.5;
        text-align: center;
        padding-top: 12px;
      }

      .block-blue-top {
        left: 285px;
        top: 0;
        width: 340px;
        height: 125px;
        background-color: #548dd4;
        color: white;
        z-index: 1;
      }

      .block-green {
        left: 0;
        top: 80px;
        width: 305px;
        height: 140px;
        background-color: #00b050;
        color: #111;
        z-index: 2;
      }

      .block-blue-bottom {
        left: 285px;
        top: 190px;
        width: 360px;
        height: 125px;
        background-color: #548dd4;
        color: white;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="block block-blue-top">Текст всередині блоку</div>
      <div class="block block-green">Текст всередині блоку</div>
      <div class="block block-blue-bottom">Текст всередині блоку</div>
    </div>
  </body>
</html>
