<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display table</title>
    <style type="text/css">
      table {
        border-collapse: collapse;
        width: 400px;
      }
      td {
        border: 5px solid #000;
      }
      tr {
        width: 60px;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <div align="center">
      <a href="../index.html">Повернутись на головну</a>
    </div>

    <table align="center">
      <tr>
        <td colspan="8" bgcolor="#2fffd2"><br /></td>
      </tr>
      <tr>
        <td rowspan="6" bgcolor="#ffffcc"><br /></td>
        <td colspan="6" bgcolor="#2fffd2"><br /></td>
        <td rowspan="6" bgcolor="#ffffcc"><br /></td>
      </tr>
      <tr>
        <td rowspan="4" bgcolor="#ffffcc"><br /></td>
        <td colspan="4" bgcolor="#2fffd2"><br /></td>
        <td rowspan="4" bgcolor="#ffffcc"><br /></td>
      </tr>
      <tr>
        <td rowspan="2" bgcolor="#ffffcc"><br /></td>
        <td bgcolor="#ff0000"><br /></td>
        <td bgcolor="#0000ff"><br /></td>
        <td rowspan="2" bgcolor="#ffffcc"><br /></td>
      </tr>
      <tr>
        <td bgcolor="#00ff00"><br /></td>
        <td bgcolor="#ffff00"><br /></td>
      </tr>
      <tr>
        <td colspan="4" bgcolor="#2fffd2"><br /></td>
      </tr>
      <tr>
        <td colspan="6" bgcolor="#2fffd2"><br /></td>
      </tr>
      <tr>
        <td colspan="8" bgcolor="#2fffd2"><br /></td>
      </tr>
    </table>
  </body>
</html>
