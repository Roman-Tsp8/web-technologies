<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Display table</title>
    <style>
      table {
        border: 2px solid black;
        border-collapse: collapse;
      }
      td {
        width: 80px;
        height: 80px;
        border: 1px solid black;
      }
      .t {
        background: #2fffd2;
      }
      .c {
        background: #ffffcc;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <a href="../index.html">Повернутись на головну</a>
    </div>
    <table>
      <tr>
        <td class="t" colspan="8"></td>
      </tr>
      <tr>
        <td class="c" rowspan="6"></td>
        <td class="t" colspan="6"></td>
        <td class="t" rowspan="6"></td>
      </tr>
      <tr>
        <td class="c" rowspan="4"></td>
        <td class="t" colspan="4"></td>
        <td class="c" rowspan="4"></td>
      </tr>
      <tr>
        <td class="c" rowspan="2"></td>
        <td style="background: red"></td>
        <td style="background: blue"></td>
        <td class="c" rowspan="2"></td>
      </tr>
      <tr>
        <td style="background: lime"></td>
        <td style="background: yellow"></td>
      </tr>
      <tr>
        <td class="t" colspan="4"></td>
      </tr>
      <tr>
        <td class="t" colspan="6"></td>
      </tr>
      <tr>
        <td class="t" colspan="8"></td>
      </tr>
    </table>
  </body>
</html>
