<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна 6</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: Calibri, Arial, sans-serif;
      }

      .row {
        width: 540px;
        margin: 200px auto 0;
        display: flex;
        justify-content: space-between;
      }

      .col {
        position: relative;
        width: 165px;
      }

      .block-1 {
        height: 36px;
        line-height: 36px;
        text-align: center;
        font-weight: 700;
        color: #222;
        background-color: #00b050;
        border: 2px solid #222;
        cursor: pointer;
      }

      .block-2 {
        position: absolute;
        left: 0;
        bottom: 100%;
        margin-bottom: 12px;
        box-sizing: border-box;
        width: 100%;
        height: 110px;
        padding-top: 12px;
        text-align: center;
        line-height: 1.5;
        color: white;
        background-color: #548dd4;
        border: 2px solid #222;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s;
      }

      .block-1:hover + .block-2 {
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="col">
        <div class="block-1">Блок 1</div>
        <div class="block-2">Текст всередині Блоку 2</div>
      </div>
      <div class="col">
        <div class="block-1">Блок 1</div>
        <div class="block-2">Текст всередині Блоку 2</div>
      </div>
      <div class="col">
        <div class="block-1">Блок 1</div>
        <div class="block-2">Текст всередині Блоку 2</div>
      </div>
    </div>
  </body>
</html>
